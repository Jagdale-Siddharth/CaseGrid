# Starts PostgreSQL, the API (seeded with demo data) and the built frontend.
#   docker compose up --build        then open http://localhost:5173  (API docs: http://localhost:8000/docs)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: aicte, POSTGRES_PASSWORD: aicte, POSTGRES_DB: aicte_complaints }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aicte"], interval: 3s, retries: 20 }
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://aicte:aicte@db:5432/aicte_complaints
      SECRET_KEY: change-me-before-any-real-use
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FIXED_TODAY: "2026-10-23"
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  web:
    build: { context: ./frontend, args: { VITE_API_URL: "http://localhost:8000" } }
    ports: ["5173:80"]
    depends_on: [api]
volumes: { pgdata: {} }
